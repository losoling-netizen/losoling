<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>樂齡輕鬆開口說英文 - 網頁測試版 v7</title>
<style>
:root{
  --scale:1;
  --green:#4F9957; --green-tint:#EAF5E1; --green-btn:#59A54D;
  --blue:#4D94C7; --blue-tint:#E6F2FA; --blue-btn:#4E9BCB;
  --orange:#CA7456; --orange-tint:#FCEEE3; --orange-btn:#E4784E;
  --pink:#B45D67; --pink-tint:#FBEAEC; --pink-btn:#C86F6F;
  --topic-blue:#1565C0;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Microsoft JhengHei","PingFang TC",sans-serif;-webkit-tap-highlight-color:transparent}
body{background:#E5E7EB;display:flex;justify-content:center;min-height:100vh}
.app-shell{width:100%;max-width:420px;background:#FBF8F2;min-height:100vh;display:flex;flex-direction:column;box-shadow:0 10px 30px rgba(0,0,0,.15);position:relative}
.notice{background:#FFF3D0;color:#8A6D00;font-size:11px;font-weight:700;padding:7px 16px;text-align:center;border-bottom:1px solid #F2C94C}
.tabpage{display:none;flex:1;flex-direction:column;min-height:0}
.tabpage.active{display:flex}
.scroll{flex:1;overflow-y:auto;padding:14px 16px 90px}

/* ---- hero banner (首頁，未更動) ---- */
.hero-banner{width:100%;display:block;aspect-ratio:1717/916;object-fit:cover}
.section-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.section-title{font-size:calc(20px*var(--scale));font-weight:800;color:#2E251F}
.icon-btn{min-height:40px;border-radius:20px;background:#fff;border:1.5px solid #E8DFC8;display:flex;align-items:center;justify-content:center;font-size:calc(15px*var(--scale));font-weight:800;color:#4A4038;cursor:pointer;padding:0 14px;gap:5px}

.v3-card-stack{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.v3-card{min-height:86px;border-radius:20px;padding:10px 12px;display:flex;align-items:center;text-decoration:none;border:none;cursor:pointer;width:100%;text-align:left}
.v3-icon-box{width:56px;height:56px;border-radius:15px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:26px;margin-right:12px;flex-shrink:0}
.v3-card-copy{flex:1;min-width:0}
.v3-card-title{font-size:calc(21px*var(--scale));font-weight:800;line-height:1.3}
.v3-card-sub{font-size:calc(15px*var(--scale));font-weight:700;color:#5F544D;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v3-start-btn{min-height:46px;border-radius:14px;color:#fff;display:flex;align-items:center;justify-content:center;gap:4px;padding:0 14px;font-size:calc(15px*var(--scale));font-weight:800;flex-shrink:0}
.v3-translate-card{min-height:86px;margin-top:18px;margin-bottom:10px;border-radius:20px;background:#fff;border:1px solid #E5E2D8;padding:10px 12px;display:flex;align-items:center;text-decoration:none}
.v3-translate-icon{width:52px;height:52px;border-radius:26px;background:#E7EEF2;display:flex;align-items:center;justify-content:center;font-size:22px;margin-right:12px;flex-shrink:0}
.v3-translate-title{font-size:calc(18px*var(--scale));font-weight:800;color:#3E332C}
.v3-translate-btn{min-height:46px;border-radius:14px;background:#E5F2DF;padding:0 14px;display:flex;align-items:center;justify-content:center;font-size:calc(15px*var(--scale));font-weight:800;color:#5F8F61;flex-shrink:0}

/* ---- 單字學習流程（一頁一單元：1單字+2情境句，緊湊排版） ---- */
.unit-topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 2px}
.unit-topic{font-size:calc(32px*var(--scale));font-weight:800;color:var(--topic-blue)}
.unit-switch-btn{font-size:calc(15px*var(--scale));font-weight:700;color:#8A8072;background:#fff;border:1.5px solid #E8DFC8;border-radius:22px;padding:11px 16px;cursor:pointer;flex-shrink:0;min-height:44px}
.unit-counter{font-size:calc(12px*var(--scale));font-weight:700;color:#5F544D;padding:0 16px;margin-bottom:6px}
.unit-progress-wrap{padding:0 16px 10px}
.unit-track{height:8px;border-radius:4px;background:#EFEAE0;overflow:hidden}
.unit-fill{height:100%;background:#4CAF50;border-radius:4px}

.unit-body{padding:0 16px}
.unit-card{background:#fff;border-radius:20px;border:1.5px solid #E5E2D8;padding:16px}
.unit-section{padding:10px 0}
.unit-section + .unit-section{border-top:1px solid #F0EAD9;margin-top:2px}
.unit-section-label{font-size:calc(11px*var(--scale));font-weight:800;color:#8A8072;margin-bottom:6px}
.unit-en{font-size:calc(20px*var(--scale));font-weight:800;color:#1B4332;line-height:1.35;word-break:break-word}
.unit-en.word-size{font-size:calc(26px*var(--scale))}
.unit-zh{font-size:calc(14px*var(--scale));font-weight:700;color:#4A4038;margin-top:4px}
.unit-ctrl-row{display:flex;gap:8px;margin-top:10px}
.accent-btn{flex:1;min-height:44px;border-radius:12px;font-weight:800;font-size:calc(13px*var(--scale));cursor:pointer;border:2px solid;display:flex;align-items:center;justify-content:center;gap:3px}
.accent-btn.gb{background:#F4F0FC;border-color:#B7A6E8;color:#5A4A9E}
.accent-btn.us{background:#EAF2FB;border-color:#8DB9E0;color:#2E6E97}
.star-toggle{width:44px;height:44px;border-radius:12px;border:2px solid #D8D2C4;background:#fff;font-size:19px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.star-toggle.done{background:#FFF3D0;border-color:#F2C94C}

.unit-complete-banner{background:#E8F5E9;border:1.5px solid #C8E6C9;border-radius:16px;padding:12px;text-align:center;font-weight:800;color:#2E7D32;font-size:calc(13px*var(--scale));margin:0 16px 10px}

.unit-nav-bar{display:flex;gap:8px;padding:10px 16px;background:#FBF8F2;border-top:1px solid #EFEAE0;align-items:center}
.unit-nav-counter{font-size:calc(13px*var(--scale));font-weight:800;color:#5F544D;flex-shrink:0;padding:0 4px}
.unit-nav-btn{flex:1;min-height:50px;border-radius:14px;font-weight:800;font-size:calc(15px*var(--scale));border:2px solid #D8D2C4;background:#fff;color:#4A4038;cursor:pointer}
.unit-nav-btn.primary{background:#2E7D32;border-color:#2E7D32;color:#fff}
.unit-nav-btn:disabled{opacity:.4;cursor:not-allowed}

/* ---- 收藏 ---- */
.list{display:flex;flex-direction:column;gap:10px}
.item-card{background:#fff;border-radius:16px;border:1.5px solid #E5E2D8;padding:12px;display:flex;align-items:flex-start;gap:10px}
.item-text{flex:1;min-width:0}
.item-tag{display:inline-block;font-size:calc(10px*var(--scale));font-weight:800;color:#2E7D32;background:#E8F5E9;padding:2px 8px;border-radius:8px;margin-bottom:5px;margin-right:5px}
.item-tag.stype{color:#2E6E97;background:#E6F2FA}
.item-en{font-size:calc(16px*var(--scale));font-weight:800;color:#1B4332}
.item-zh{font-size:calc(12px*var(--scale));font-weight:700;color:#4A4038;margin-top:2px}
.circle-btn{width:32px;height:32px;border-radius:16px;background:#FFF3D0;border:1.5px solid #F2C94C;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.empty{text-align:center;color:#9A9184;padding:40px 0;font-weight:600;font-size:calc(13px*var(--scale))}

/* ---- 我的 / 進度 ---- */
.stat-card{background:#fff;border-radius:16px;border:1.5px solid #C8E6C9;padding:14px;margin-bottom:14px}
.stat-head{display:flex;justify-content:space-between;font-size:calc(13px*var(--scale));font-weight:800;color:#2E7D32;margin-bottom:8px}
.stat-track{height:12px;border-radius:6px;background:#E8F5E9;border:1px solid #C8E6C9;overflow:hidden}
.stat-fill{height:100%;background:#4CAF50}
.breakdown-block{background:#fff;border:1px solid #E5E2D8;border-radius:14px;margin-bottom:10px;overflow:hidden}
.breakdown-head{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;cursor:pointer}
.breakdown-head .name{font-size:calc(14px*var(--scale));font-weight:800;color:#2E251F}
.breakdown-head .val{font-size:calc(12px*var(--scale));font-weight:800;color:#2E7D32}
.breakdown-detail{display:none;border-top:1px solid #EFEAE0;max-height:280px;overflow-y:auto}
.breakdown-detail.show{display:block}
.detail-row{display:flex;justify-content:space-between;align-items:center;padding:9px 14px;border-bottom:1px solid #F5F2EA;font-size:calc(12px*var(--scale));cursor:pointer}
.detail-row .en{font-weight:800;color:#2E251F}
.detail-row .status{display:flex;gap:5px}
.detail-row .dot{font-size:10px;font-weight:800;padding:2px 5px;border-radius:7px;background:#F5F2EA;color:#9A9184}
.detail-row .dot.done{background:#FFF3D0;color:#8A6D00}
.setting-group{margin-bottom:16px}
.setting-label{font-size:calc(12px*var(--scale));font-weight:800;color:#4A4038;margin-bottom:8px;display:block}
.opt-row{display:flex;gap:8px}
.opt-btn{flex:1;min-height:46px;border-radius:12px;border:1.5px solid #D8D2C4;background:#fff;font-size:calc(12px*var(--scale));font-weight:800;color:#4A4038;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.opt-btn.active{background:#88D49E;border-color:#2E7D32;color:#1B4332}
.reset-btn{width:100%;min-height:46px;border-radius:12px;background:#FCEBEB;border:1.5px solid #F09595;color:#A32D2D;font-weight:800;font-size:13px;cursor:pointer}

/* ---- bottom tab ---- */
.bottom-tab{background:#FBF8F2;border-top:1px solid #EFEAE0;display:flex;max-width:420px;margin:0 auto;width:100%}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 0 14px;background:none;border:none;cursor:pointer;color:#9A9184;font-size:calc(13px*var(--scale));font-weight:800}
.tab-item.active{color:#3F8A4A}
.tab-item .icon{font-size:28px}

.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:1000;align-items:flex-end;justify-content:center}
.modal-overlay.show{display:flex}
.modal-sheet{width:100%;max-width:420px;background:#fff;border-radius:22px 22px 0 0;padding:18px;max-height:82vh;overflow-y:auto}
.modal-header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #EFEAE0;padding-bottom:10px;margin-bottom:14px}
.modal-title{font-size:calc(17px*var(--scale));font-weight:800;color:#2E251F}
.close-btn{width:34px;height:34px;border-radius:17px;background:#F5F2EA;border:none;font-size:15px;cursor:pointer}
.save-btn{width:100%;min-height:48px;border-radius:13px;background:#2E7D32;color:#fff;font-weight:800;font-size:15px;border:none;margin-top:6px;cursor:pointer}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#1B4332;color:#fff;padding:11px 20px;border-radius:18px;font-weight:700;font-size:12px;z-index:2000;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}

/* ---- 我的分頁：放大版總進度＋四大主題進度（含圖示） ---- */
.total-card-lg{background:#fff;border-radius:22px;border:2px solid #C8E6C9;padding:22px;margin-bottom:18px;text-align:center}
.total-label-lg{font-size:calc(17px*var(--scale));font-weight:800;color:#2E7D32;margin-bottom:6px}
.total-value-lg{font-size:calc(28px*var(--scale));font-weight:800;color:#1B4332}
.total-pct-lg{font-size:calc(16px*var(--scale));font-weight:800;color:#4CAF50;margin:2px 0 14px}
.total-track-lg{height:18px;border-radius:9px;background:#E8F5E9;border:1px solid #C8E6C9;overflow:hidden}
.total-fill-lg{height:100%;background:#4CAF50}
.theme-stack-lg{display:flex;flex-direction:column;gap:14px;margin-bottom:20px}
.theme-card-lg{border-radius:20px;padding:16px}
.theme-card-lg .head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.theme-card-lg .icon-box{width:44px;height:44px;border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.theme-card-lg .name{flex:1;font-size:calc(19px*var(--scale));font-weight:800}
.theme-card-lg .val{font-size:calc(15px*var(--scale));font-weight:800}
.theme-track-lg{height:12px;border-radius:6px;background:#FFFFFF99;overflow:hidden}
.theme-fill-lg{height:100%;border-radius:6px}
.reset-btn-lg{width:100%;min-height:52px;border-radius:15px;background:#FCEBEB;border:1.5px solid #F09595;color:#A32D2D;font-weight:800;font-size:calc(15px*var(--scale));cursor:pointer;margin-bottom:20px}

.icon-btn-lg{min-height:52px;padding:0 18px;font-size:calc(17px*var(--scale));border-radius:26px}

.unit-topic-row{display:flex;align-items:center;gap:9px;flex:1;min-width:0}
.unit-topic-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
</style>
</head>
<body>
<div class="app-shell">

  <!-- ================= 首頁 ================= -->
  <div class="tabpage active" id="tab-home">
    <div class="scroll" style="padding:0 0 90px">
      <img src="https://duk.tw/WLxPL5.png" class="hero-banner" alt="樂齡輕鬆開口說英文首頁圖片" />

      <div style="padding:0 18px">
        <div class="section-header" style="margin-top:20px">
          <span class="section-title" style="font-size:calc(21px*var(--scale))">開啟學習的旅程</span>
          <button class="icon-btn icon-btn-lg" onclick="openSettings()" aria-label="設定">⚙️ 設定</button>
        </div>

        <div class="v3-card-stack" id="scenario-scroll"></div>

        <a class="v3-translate-card" href="https://translate.google.com/?sl=auto&tl=zh-TW&op=translate" target="_blank" rel="noopener">
          <div class="v3-translate-icon">🌐</div>
          <div class="v3-card-copy">
            <div class="v3-translate-title">Google 翻譯</div>
            <div class="v3-card-sub">查單字、聽發音、看例句</div>
          </div>
          <div class="v3-translate-btn">前往翻譯 ↗</div>
        </a>
      </div>
    </div>
  </div>

  <!-- ================= 單字 ================= -->
  <div class="tabpage" id="tab-vocab">
    <div class="scroll" style="padding-bottom:14px">
      <div class="unit-topbar">
        <div class="unit-topic-row">
          <div class="unit-topic-icon" id="unit-topic-icon">👜</div>
          <span class="unit-topic" id="unit-topic">生活日常</span>
        </div>
        <button class="unit-switch-btn" onclick="switchTab('home')">🔄 切換主題</button>
      </div>
      <div class="unit-counter" id="unit-counter" style="display:flex;justify-content:space-between;align-items:center">
        <span>第 1 / 100</span>
        <span onclick="debugListGbVoices()" style="font-size:11px;color:#B0A489;text-decoration:underline;cursor:pointer">🔍 查看手機英式語音清單</span>
      </div>
      <div class="unit-progress-wrap">
        <div class="unit-track"><div class="unit-fill" id="unit-fill" style="width:0%"></div></div>
      </div>

      <div id="unit-complete-banner" class="unit-complete-banner" style="display:none">🎉 這個主題全部學完了！</div>

      <div class="unit-body">
        <div class="unit-card">
          <!-- 英文單字 -->
          <div class="unit-section">
            <div class="unit-section-label">英文單字</div>
            <div class="unit-en word-size" id="unit-word">Water</div>
            <div class="unit-zh" id="unit-word-zh">水</div>
            <div class="unit-ctrl-row">
              <button class="accent-btn gb" onclick="speakItem('word','en-GB')">🇬🇧 英式發音</button>
              <button class="accent-btn us" onclick="speakItem('word','en-US')">🇺🇸 美式發音</button>
              <button class="star-toggle" id="star-word" onclick="toggleStar('word')" aria-label="單字學習完成">☆</button>
            </div>
          </div>

          <!-- 情境句1 -->
          <div class="unit-section">
            <div class="unit-section-label">情境句 1</div>
            <div class="unit-en" id="unit-s1-en">...</div>
            <div class="unit-zh" id="unit-s1-zh">...</div>
            <div class="unit-ctrl-row">
              <button class="accent-btn gb" onclick="speakItem('s1','en-GB')">🇬🇧 英式發音</button>
              <button class="accent-btn us" onclick="speakItem('s1','en-US')">🇺🇸 美式發音</button>
              <button class="star-toggle" id="star-s1" onclick="toggleStar('s1')" aria-label="情境句1學習完成">☆</button>
            </div>
          </div>

          <!-- 情境句2 -->
          <div class="unit-section">
            <div class="unit-section-label">情境句 2</div>
            <div class="unit-en" id="unit-s2-en">...</div>
            <div class="unit-zh" id="unit-s2-zh">...</div>
            <div class="unit-ctrl-row">
              <button class="accent-btn gb" onclick="speakItem('s2','en-GB')">🇬🇧 英式發音</button>
              <button class="accent-btn us" onclick="speakItem('s2','en-US')">🇺🇸 美式發音</button>
              <button class="star-toggle" id="star-s2" onclick="toggleStar('s2')" aria-label="情境句2學習完成">☆</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 頁面導航 -->
    <div class="unit-nav-bar">
      <button class="unit-nav-btn" id="prev-btn" onclick="prevUnit()">〈 上一頁</button>
      <div class="unit-nav-counter" id="unit-nav-counter">第 1/100 頁</div>
      <button class="unit-nav-btn primary" id="next-btn" onclick="nextUnit()">下一頁 〉</button>
    </div>
  </div>

  <!-- ================= 收藏 ================= -->
  <div class="tabpage" id="tab-favorites">
    <div class="scroll">
      <div class="section-header"><span class="section-title" style="font-size:calc(24px*var(--scale))">⭐ 已標記學會</span></div>
      <div class="list" id="favorites-list"></div>
    </div>
  </div>

  <!-- ================= 我的 ================= -->
  <div class="tabpage" id="tab-profile">
    <div class="scroll">
      <div class="section-header"><span class="section-title" style="font-size:calc(24px*var(--scale))">📊 學習進度</span></div>

      <div class="total-card-lg">
        <div class="total-label-lg">學習總進度</div>
        <div class="total-value-lg" id="profile-total-value">0 / 480</div>
        <div class="total-pct-lg" id="profile-total-pct">0%</div>
        <div class="total-track-lg"><div class="total-fill-lg" id="profile-total-fill" style="width:0%"></div></div>
      </div>

      <div id="profile-breakdown" class="theme-stack-lg"></div>

      <button class="reset-btn-lg" onclick="resetProgress()">重置學習紀錄</button>
    </div>
  </div>

  <div class="bottom-tab">
    <button class="tab-item active" id="navtab-home" onclick="switchTab('home')"><span class="icon">🏠</span><span>首頁</span></button>
    <button class="tab-item" id="navtab-vocab" onclick="switchTab('vocab')"><span class="icon">📖</span><span>單字</span></button>
    <button class="tab-item" id="navtab-favorites" onclick="switchTab('favorites')"><span class="icon">⭐</span><span>收藏</span></button>
    <button class="tab-item" id="navtab-profile" onclick="switchTab('profile')"><span class="icon">👤</span><span>我的</span></button>
  </div>

  <!-- ================= 設定 Modal ================= -->
  <div class="modal-overlay" id="settings-modal">
    <div class="modal-sheet">
      <div class="modal-header">
        <span class="modal-title">⚙️ 偏好設定</span>
        <button class="close-btn" onclick="closeSettings()">✕</button>
      </div>
      <div class="setting-group">
        <span class="setting-label">字體大小（顯著對比放大）</span>
        <div class="opt-row">
          <button class="opt-btn" id="m-font-md" onclick="setFontScale(1,this)">標準<br>18px</button>
          <button class="opt-btn active" id="m-font-lg" onclick="setFontScale(1.3,this)">放大<br>24px</button>
          <button class="opt-btn" id="m-font-xl" onclick="setFontScale(1.6,this)">特大<br>30px</button>
        </div>
      </div>
      <div class="setting-group">
        <span class="setting-label">發音速度 (Speech Speed)</span>
        <div class="opt-row">
          <button class="opt-btn" id="m-rate-slow" onclick="setRate(0.78,this)">🐢<br>慢速</button>
          <button class="opt-btn active" id="m-rate-mid" onclick="setRate(0.90,this)">☕<br>舒適</button>
          <button class="opt-btn" id="m-rate-norm" onclick="setRate(1.0,this)">🐇<br>標準</button>
        </div>
      </div>
      <button class="save-btn" onclick="closeSettings()">儲存並關閉</button>
    </div>

/* ---------------- 單字學習流程 ---------------- */
function currentUnitIndex() { return unitIndexByScenario[currentScenario] || 0; }
function setCurrentUnitIndex(idx) {
  const units = UNITS_BY_SCENARIO[currentScenario];
  unitIndexByScenario[currentScenario] = Math.max(0, Math.min(idx, units.length - 1));
  saveUnitIndex();
}

function unitProgress(sid) {
  const units = UNITS_BY_SCENARIO[sid];
  let done = 0;
  units.forEach(u => {
    const w = !!learnedMap[u.word.id];
    const s1 = !u.s1 || !!learnedMap[u.s1.id];
    const s2 = !u.s2 || !!learnedMap[u.s2.id];
    if (w && s1 && s2) done++;
  });
  return { done, total: units.length };
}

function renderUnit() {
  const units = UNITS_BY_SCENARIO[currentScenario];
  const idx = currentUnitIndex();
  const unit = units[idx];

  document.getElementById("unit-topic").textContent = LESSON_DATA[currentScenario].title;
  const topicIconBg = { daily:"#4F995722", travel:"#4D94C722", restaurant:"#CA745622", emergency:"#B45D6722" };
  const topicIconColor = { daily:"#4F9957", travel:"#4D94C7", restaurant:"#CA7456", emergency:"#B45D67" };
  const iconEl = document.getElementById("unit-topic-icon");
  iconEl.textContent = SCENARIO_META[currentScenario].icon;
  iconEl.style.background = topicIconBg[currentScenario];
  iconEl.style.color = topicIconColor[currentScenario];
  document.getElementById("unit-counter").querySelector("span").textContent = `第 ${idx+1} / ${units.length}`;
  document.getElementById("unit-nav-counter").textContent = `第 ${idx+1}/${units.length} 頁`;

  document.getElementById("unit-word").textContent = unit.word.en;
  document.getElementById("unit-word-zh").textContent = unit.word.zh;

  document.getElementById("unit-s1-en").textContent = unit.s1 ? unit.s1.en : "（無）";
  document.getElementById("unit-s1-zh").textContent = unit.s1 ? unit.s1.zh : "";
  document.getElementById("unit-s2-en").textContent = unit.s2 ? unit.s2.en : "（無）";
  document.getElementById("unit-s2-zh").textContent = unit.s2 ? unit.s2.zh : "";

  updateStarButton("word", !!learnedMap[unit.word.id]);
  updateStarButton("s1", unit.s1 ? !!learnedMap[unit.s1.id] : true);
  updateStarButton("s2", unit.s2 ? !!learnedMap[unit.s2.id] : true);

  document.getElementById("prev-btn").disabled = idx === 0;
  document.getElementById("next-btn").textContent = idx === units.length - 1 ? "完成本主題 ✓" : "下一頁 〉";

  const prog = unitProgress(currentScenario);
  const pct = prog.total > 0 ? Math.round(prog.done/prog.total*100) : 0;
  document.getElementById("unit-fill").style.width = pct + "%";
  document.getElementById("unit-complete-banner").style.display = (prog.done === prog.total) ? "block" : "none";
}

function updateStarButton(key, done) {
  const btn = document.getElementById("star-"+key);
  btn.textContent = done ? "⭐" : "☆";
  btn.classList.toggle("done", done);
}

function currentUnitItem(key) {
  const unit = UNITS_BY_SCENARIO[currentScenario][currentUnitIndex()];
  if (key === "word") return unit.word;
  if (key === "s1") return unit.s1;
  if (key === "s2") return unit.s2;
}

/* 英式/美式各自獨立的按鍵：直接指定 accent 播放，兩顆鍵播放內容相同文字但語音真的不同腔調 */
function speakItem(key, accent) {
  const item = currentUnitItem(key);
  if (!item) return;
  speak(item.en, accent);
}

function toggleStar(key) {
  const item = currentUnitItem(key);
  if (!item) return;
  learnedMap[item.id] = !learnedMap[item.id];
  saveProgress();
  renderUnit();
}

function prevUnit() {
  const idx = currentUnitIndex();
  if (idx === 0) return;
  setCurrentUnitIndex(idx - 1);
  renderUnit();
  document.querySelector("#tab-vocab .scroll").scrollTo(0,0);
}
function nextUnit() {
  const units = UNITS_BY_SCENARIO[currentScenario];
  const idx = currentUnitIndex();
  if (idx === units.length - 1) { showToast("🎉 這個主題已經全部學完了！"); return; }
  setCurrentUnitIndex(idx + 1);
  renderUnit();
  document.querySelector("#tab-vocab .scroll").scrollTo(0,0);
}

function jumpToUnit(sid, idx) {
  currentScenario = sid;
  setCurrentUnitIndex(idx);
  switchTab("vocab");
}

/* ---------------- speech：英式/美式必須是真正不同語系的語音，不是同一顆換名字 ---------------- */
let cachedVoices = [];
function refreshVoices() { cachedVoices = window.speechSynthesis.getVoices(); }

// 修正：手機瀏覽器（尤其 Safari）載入語音清單常常需要一點時間，
// 頁面剛打開就馬上按發音，清單很可能還是空的，會誤判成「沒有偵測到語音」。
// 這裡改成主動重試等待，最多等 1.5 秒，清單準備好了再判斷。
function waitForVoices(maxAttempts) {
  maxAttempts = maxAttempts || 15;
  return new Promise(resolve => {
    function attempt(n) {
      const list = window.speechSynthesis.getVoices();
      if (list.length > 0) { cachedVoices = list; resolve(list); return; }
      if (n >= maxAttempts) { resolve(list); return; }
      setTimeout(() => attempt(n + 1), 100);
    }
    attempt(0);
  });
}
const FEMALE_HINTS = {
  "en-US": ["google us english","samantha","ava","allison","susan","victoria","nicky","zira","aria","jenny","female"],
  "en-GB": ["google uk english female","serena","hazel","kate","libby","sonia","amy","emma","olivia","female"]
};
const MALE_BLOCKLIST = ["daniel","fred","alex","aaron","arthur","google uk english male","ryan","guy","david","male","oliver","thomas","george","james","gordon","stuart","rishi","neel","eddy"];

function isBlockedMaleVoice(text) {
  // 關鍵修正：不能用 text.includes("male") 這種子字串比對！
  // "female" 這個字本身就包含 "male"（fe-male），子字串比對會把女聲也一起誤刪掉。
  // 改成「完整單字」比對，"female" 就不會再被誤判成男聲了。
  return MALE_BLOCKLIST.some(bad => new RegExp("\\b"+bad+"\\b").test(text));
}

function pickVoice(accent) {
  if (!cachedVoices.length) refreshVoices();
  // 嚴格只挑語系完全對應 en-GB / en-US 的語音，兩者絕不共用同一顆
  const langVoices = cachedVoices.filter(v => v.lang === accent || v.lang.toLowerCase() === accent.toLowerCase());
  if (langVoices.length === 0) return null;
  const candidates = langVoices.filter(v => !isBlockedMaleVoice(v.name.toLowerCase()));
  const hints = FEMALE_HINTS[accent] || [];
  let best = null, bestScore = -1;
  (candidates.length ? candidates : langVoices).forEach(v => {
    let score = 0;
    hints.forEach((hint, idx) => { if (v.name.toLowerCase().includes(hint)) score += (hints.length - idx); });
    if (!v.localService) score += 20; // 網路合成語音通常比裝置內建語音清晰自然，這次再加重權重優先挑選
    if (score > bestScore) { bestScore = score; best = v; }
  });
  return best;
}

/* ---------------- 恢復的裝置預設語音邏輯 ---------------- */

async function speak(text, accent) {
  if (!("speechSynthesis" in window)) { showToast("此瀏覽器不支援語音功能"); return; }

  window.speechSynthesis.cancel();

  // 先確實等待語音清單載入完成（最多 1.5 秒），避免頁面剛打開語音清單還沒準備好，
  // 就被誤判成「這支手機沒有這個語言的語音」。
  if (cachedVoices.length === 0) {
    await waitForVoices();
  }

  // 關鍵修正：手機瀏覽器上 cancel() 之後語音引擎不一定「立刻」釋放播放通道，
  // 緊接著馬上 speak() 容易讓上一段語音跟新的一段疊在一起播放，聽起來就會混濁、像連音。
  // 用短暫的延遲確保上一段確實停止乾淨後，再開始播放新的一段。
  setTimeout(() => {
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = accent;
    utter.rate = appSettings.rate;
    utter.pitch = 1.0;
    const voice = pickVoice(accent);
    if (voice) {
      utter.voice = voice;
      // 暫時性診斷提示：顯示這支手機實際選到的語音名稱，方便精準定位問題語音是哪一顆
      showToast("使用語音：" + voice.name);
    } else {
      showToast((accent==="en-GB" ? "此裝置沒有偵測到英式語音" : "此裝置沒有偵測到美式語音") + "（將使用系統預設）");
    }
    window.speechSynthesis.speak(utter);
  }, 150);
}

/* 暫時性診斷工具：列出這支手機目前所有可用的英式語音，方便一次看到全部選項 */
function debugListGbVoices() {
  const voices = window.speechSynthesis.getVoices().filter(v => v.lang === "en-GB" || v.lang.toLowerCase() === "en-gb");
  if (voices.length === 0) { showToast("這支手機完全沒有偵測到 en-GB 語音"); return; }
  alert("這支手機目前偵測到的英式語音（共 " + voices.length + " 顆）：\n\n" +
    voices.map((v, i) => (i+1) + ". " + v.name + (v.localService ? "（本機）" : "（網路）")).join("\n"));
}

/* ---------------- settings ---------------- */
function openSettings() { document.getElementById("settings-modal").classList.add("show"); }
function closeSettings() { document.getElementById("settings-modal").classList.remove("show"); }
function persistSettings() { try { localStorage.setItem("senior_eng_settings_v5", JSON.stringify(appSettings)); } catch(e) {} }

function setFontScale(scale, btn) {
  appSettings.fontScale = scale;
  document.documentElement.style.setProperty("--scale", scale);
  document.querySelectorAll("#m-font-md,#m-font-lg,#m-font-xl").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  persistSettings();
}

function setRate(rate, btn) {
  appSettings.rate = rate;
  document.querySelectorAll("#m-rate-slow,#m-rate-mid,#m-rate-norm").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  persistSettings();
}

document.getElementById("settings-modal").addEventListener("click", (e) => {
  if (e.target.id === "settings-modal") closeSettings();
});

if ("speechSynthesis" in window) {
  refreshVoices();
  window.speechSynthesis.onvoiceschanged = refreshVoices;
  // 頁面一開始載入就主動預熱一次，減少使用者第一次點擊發音時要等待的機率
  waitForVoices();
}

try {
  const saved = JSON.parse(localStorage.getItem("senior_eng_settings_v5") || "null");
  if (saved) {
    appSettings = { ...appSettings, ...saved };
    document.documentElement.style.setProperty("--scale", appSettings.fontScale);
    const fontId = appSettings.fontScale === 1 ? "font-md" : appSettings.fontScale === 1.6 ? "font-xl" : "font-lg";
    const rateId = appSettings.rate === 0.78 ? "rate-slow" : appSettings.rate === 1.0 ? "rate-norm" : "rate-mid";
    document.querySelectorAll("#m-font-md,#m-font-lg,#m-font-xl").forEach(b => b.classList.remove("active"));
    document.querySelectorAll("#m-rate-slow,#m-rate-mid,#m-rate-norm").forEach(b => b.classList.remove("active"));
    document.getElementById("m-"+fontId).classList.add("active");
    document.getElementById("m-"+rateId).classList.add("active");
  }
} catch(e) {}

renderHome();
</script>
